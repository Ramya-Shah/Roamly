# Single-image nginx config (deployment build).
#
# Differs from nginx.conf (the docker-compose dev config) in two ways:
#   - listens on 9080 (the port the hackathon deploy harness maps and health-checks)
#   - proxies /api/ to the uvicorn backend at localhost:8090 rather than to a
#     separate `dashboard_api` container, because in the deployed image the
#     frontend, backend, and MCP sandbox all run as processes inside ONE container.
server {
    listen 9080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events must not be buffered, or the browser only sees
    # progress in one big chunk at the end instead of live. Regex location
    # (not a "/api/runs/" prefix) avoids nginx's trailing-slash 301 quirk
    # that would otherwise break the non-streaming /api/runs endpoint.
    location ~ ^/api/runs/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
