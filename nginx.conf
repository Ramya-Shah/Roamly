server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events must not be buffered, or the browser only sees
    # progress in one big chunk at the end instead of live. Uses a regex
    # location (rather than a plain "/api/runs/" prefix) because nginx
    # special-cases any prefix location ending in "/": a request for the
    # same path minus the trailing slash (i.e. plain "GET /api/runs") gets
    # a 301 redirect appended with a slash before normal prefix-length
    # matching is even considered, which broke the non-streaming endpoints.
    location ~ ^/api/runs/[^/]+/stream$ {
        proxy_pass http://dashboard_api:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://dashboard_api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
