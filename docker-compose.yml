services:
  postgres:
    image: postgres:16-alpine
    container_name: roamly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: roamly_password
      POSTGRES_DB: roamly_db
    ports:
      - "5432:5432"
    volumes:
      - roamly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamly -d roamly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: roamly-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://roamly:roamly_password@postgres:5432/roamly_db?schema=public"
      PORT: 3001
      HOST: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  roamly_pgdata:
