# Task metadata and resource configuration. Set the two metadata fields below
# for your task; tune resource defaults only if your task actually needs more.
# Full guidance: docs/task-anatomy.md → task.toml section.

[metadata]
# REPLACE: pick the closest allowed category and set a non-zero estimate.
# Allowed: software_engineering, system_administration, security,
# scientific_computing, data_science, machine_learning, other.
# Use "other" only when none of the named categories reasonably fit.
category = ""
expert_time_estimate_hours = 0   # best-case hours for a focused expert who knows the answer

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 18000.0            # raise for tasks that may take an agent multiple hours

[environment]
build_timeout_sec = 6000.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0                         # set to 1 only if the task genuinely needs GPU
# Keep true: this is the agent environment, and Harbor's claude-code setup needs
# network access. For TB3-style offline verification, keep this true and use a
# separate vendored verifier environment; see docs/task-anatomy.md.
allow_internet = true
