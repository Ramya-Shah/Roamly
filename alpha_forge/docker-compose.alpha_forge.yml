networks:
  alpha_forge_net:
    driver: bridge

services:
  sandbox_execution:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    ports:
      - "8000:8000"
    volumes:
      # Raw historical LOB data is read-only: generated strategies must
      # never be able to mutate the ground-truth replay input.
      - ./historical_data:/app/data:ro
      # Writeable scratch space where the orchestrator's write_strategy_code
      # tool saves AI-generated strategy source for backtest_runner.py to load.
      - ./sandbox_workspace:/app/sandbox_workspace
    environment:
      SANDBOX_WORKSPACE_DIR: /app/sandbox_workspace
      HISTORICAL_DATA_DIR: /app/data
      LOG_LEVEL: INFO
      BACKTEST_TIMEOUT_SECONDS: ${BACKTEST_TIMEOUT_SECONDS:-120}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - alpha_forge_net
    restart: unless-stopped

  # CLI-triggered pipeline runs (`docker compose run --rm orchestrator`).
  # NOTE: don't run this at the same time as dashboard_api against the same
  # memory_db volume - DuckDB's embedded file format is single-writer, and
  # two separate OS processes opening it for read-write concurrently will
  # raise a lock conflict. Use the dashboard for interactive work.
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    depends_on:
      - sandbox_execution
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: http://sandbox_execution:8000/sse
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATASET_NAME: ${DATASET_NAME:-sample_replay.npz}
      CALIBRATION_TICKS_FILE: ${CALIBRATION_TICKS_FILE:-sample_calibration.npz}
      VALIDATION_DATASET_NAME: ${VALIDATION_DATASET_NAME:-}
      OOS_MIN_RETENTION_RATIO: ${OOS_MIN_RETENTION_RATIO:-0.5}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-6}
      LOG_LEVEL: INFO
      # If running behind a corporate TLS-inspection proxy, that proxy's CA
      # needs trusting here (mount it and set SSL_CERT_FILE/REQUESTS_CA_BUNDLE)
      # for httpx/openai to verify the gateway connection - not needed on an
      # unintercepted network.
    volumes:
      # Persists cross-run optimization history (memory_manager.py's DuckDB
      # file) across container restarts.
      - ./memory_db:/app/db
    networks:
      - alpha_forge_net

  dashboard_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - sandbox_execution
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: http://sandbox_execution:8000/sse
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATASET_NAME: ${DATASET_NAME:-sample_replay.npz}
      CALIBRATION_TICKS_FILE: ${CALIBRATION_TICKS_FILE:-sample_calibration.npz}
      VALIDATION_DATASET_NAME: ${VALIDATION_DATASET_NAME:-}
      OOS_MIN_RETENTION_RATIO: ${OOS_MIN_RETENTION_RATIO:-0.5}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-6}
      LOG_LEVEL: INFO
      SANDBOX_WORKSPACE_DIR: /app/sandbox_workspace
    volumes:
      - ./memory_db:/app/db
      # Read-only: the dashboard only displays generated strategy source,
      # it never writes it - that stays exclusively write_strategy_code's job.
      - ./sandbox_workspace:/app/sandbox_workspace:ro
    networks:
      - alpha_forge_net
    restart: unless-stopped

  dashboard_ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - dashboard_api
    ports:
      - "3000:80"
    networks:
      - alpha_forge_net
    restart: unless-stopped
